<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Washington Outlaws | Vote</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%97%B3%EF%B8%8F%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body data-page="vote">
  <nav class="topbar">
    <div class="brand">Washington Outlaws</div>
    <div class="nav-links">
      <a href="/">Home</a>
      <a href="/vote.html">Vote</a>
      <a href="/admin.html">Admin</a>
      <span id="navUserName" class="nav-user hidden"></span>
      <button id="logoutButton" class="ghost-button logout-button hidden">Logout</button>
    </div>
  </nav>

  <main class="container">
    <section class="card vote-card">
      <div class="vote-header">
        <div>
          <h1>Cast Your Ballot</h1>
          <p class="vote-subtitle">Choose one candidate for each position and submit your vote before the election closes.</p>
        </div>
        <span id="voteTimer" class="timer">Loading election timer...</span>
      </div>

      <div id="voteUserName" class="vote-user-info">Please log in using your unique code from the Outlaws roster.</div>

      <form id="voteForm" class="vote-form">
        <div class="vote-grid"></div>
        <div class="vote-actions">
          <button type="submit" class="primary-button">Submit Vote</button>
          <p id="voteMessage" class="vote-message"></p>
        </div>
      </form>
    </section>
  </main>

  <script src="app.js?v=6"></script>
  <script>
    var voteGridEl = document.querySelector('.vote-grid');
    if (voteGridEl) {
      voteGridEl.addEventListener('change', function (event) {
        if (event.target && event.target.tagName === 'SELECT') {
          var field = event.target.closest('.vote-field');
          if (field) {
            field.classList.toggle('is-selected', Boolean(event.target.value));
          }
        }
      });
    }
  </script>
</body>
</html>
